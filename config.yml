LICENSE-KEY: ""

DATABASE:
  TYPE: "SQLITE" # MYSQL, MONGODB or SQLITE
  MYSQL:
    HOST: "localhost"
    DATABASE: "donut_sell"
    USER: "root"
    PASSWORD: "password"
  MONGODB:
    URI: "localhost"
    DATABASE: "DonutSell"

SETTINGS:
  WORTH-LORE: true
  WORTH-FORMAT: "&7Worth: &a$%price%"
  WORTH-DEFAULT: "&b1 {item} &7is now &a${price}"
  WORTH-HAND-ITEM: "&b{amount} {item} &7is now &a${total}"
  SELL-MESSAGE: "&a+$%price%"
  SELL-SOUND: "BLOCK_ANVIL_HIT"
  NO-SELLABLE: "&cThis item is not sellable."
  PROGRESS-BAR: "■"
  LEVEL: [25000, 150000, 500000, 1000000, 5000000, 25000000, 250000000, 550000000, 850000000,
          1000000000, 2000000000, 4000000000, 8000000000, 10000000000, 20000000000, 40000000000,
          80000000000, 160000000000, 320000000000, 640000000000]
  BUTTONS:
    NEXT-PAGE: "&aɴᴇxᴛ"
    BACK-PAGE: "&aʙᴀᴄᴋ"
    LAST-PAGE: "&aʟᴀѕᴛ ᴘᴀɢᴇ"
    FIRST-PAGE: "&aꜰɪʀѕᴛ ᴘᴀɢᴇ"

# The items in the list won't have the
# worth lore added to them.
WORTH-BLACKLIST:
  - NETHERITE_PICKAXE


SELL-HISTORY-MENU:
  TITLE: "&8ѕᴇʟʟ ʜɪѕᴛᴏʀʏ"
  SORT-BUTTON:
    MATERIAL: "ANVIL"
    TITLE: "&aSort"
    LORE:
      - "&fClick to sort"
      - ""
      - "&7(Current: {sort_state})"
  SOLD-ITEM-LORE:
    - "&fTotal price: &a{price}"
    - "&fTotal amount: {amount}"

WORTH-MENU:
  TITLE: "&8ɪᴛᴇᴍ ᴘʀɪᴄᴇѕ"
  FORMAT: "&fPrice: &a${price}"
  SORT-BUTTON:
    NAME: "&aSort Items"
    LORE:
      - "{status_HIGHEST_PRICE}"
      - "{status_LOWEST_PRICE}"
      - "{status_ALPHABETICALLY}"
  SORT-STATUS:
    HIGHEST_PRICE: "▪ Highest Price"
    LOWEST_PRICE: "▪ Lowest Price"
    ALPHABETICALLY: "▪ Alphabetically"
